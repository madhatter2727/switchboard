<!doctype html><html><head><meta charset="utf-8"><title>Switchboard</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
 <aside>
  <div class="brand"><span class="logo"></span><h1>Switchboard</h1></div>
  <div id="proxy" class="hint"></div>
  <button id="newChat"><span class="bi" data-ic="plus" data-s="16"></span><span>New chat</span></button>
  <div class="sec">Your chats</div>
  <div id="chats"></div>
  <button id="delAll" type="button" title="Move every saved chat to the Trash"><span class="bi" data-ic="trash" data-s="14"></span><span>Delete all chats</span></button>
  <div class="sec">Models <span class="hint">(click one; I start its engine)</span></div>
  <div id="engines"></div>
  <button id="refresh"><span class="bi" data-ic="refresh" data-s="14"></span><span>Refresh list</span></button>
  <div class="mem" id="mem" hidden><div class="lbl">Brain space</div><div class="bar" id="memBar" role="progressbar" aria-label="Brain space (memory in use)"><div id="memFill"></div></div><div class="sm" id="memTxt"></div></div>
 </aside>
 <main>
  <header><div class="cur"><span id="curChip" class="curchip"></span><div id="cur">No model picked yet</div></div><div id="status"></div><div class="hr"><label id="agentBox"><input type="checkbox" id="agent"><span>Agent mode</span></label><button id="gear" type="button" class="ib" title="Settings" aria-label="Settings"><span class="bi" data-ic="gear" data-s="20"></span></button></div></header><div id="agentNote"></div>
  <div id="chat"><div class="empty">Pick a model on the left, then say hi.</div></div>
  <form id="form"><div id="atts"></div><textarea id="input" rows="2" placeholder="Ask anything… (Enter to send, Shift+Enter for a new line)"></textarea>
   <span class="btns"><button id="clip" type="button" class="ib" title="Add files or pictures (you can also paste with Cmd+V or drag them in)" aria-label="Add files or pictures"><span class="bi" data-ic="clip" data-s="20"></span></button><button id="photo" type="button" class="ib" title="Ask Photo Reader about an image" aria-label="Ask Photo Reader about an image"><span class="bi" data-ic="cam" data-s="20"></span></button><button id="mic" type="button" class="ib" title="Click to talk, click again to stop. Speech stays on this Mac." aria-label="Talk"><span class="bi" data-ic="mic" data-s="20"></span></button><button id="send" type="submit"><span class="bi" data-ic="send" data-s="16" data-sw="2"></span><span>Send</span></button><button id="stop" type="button" hidden>Stop</button></span></form>
 </main>
</div>
<div id="miniBar"><button id="miniOpen" type="button">Open full window</button><button id="miniQuit" type="button">Quit</button></div>
<div id="settings" hidden><div class="box big"><h2>Settings</h2><div id="sbody"></div><div class="mb"><button id="sclose">Close</button></div></div></div>
<div id="modal" hidden><div class="box"><div id="mtext"></div><input id="minput" hidden><div class="mb"><button id="mno">Cancel</button><button id="myes">OK</button></div></div></div>
<script src="icons.js"></script>
<script>document.querySelectorAll('.bi').forEach(e=>{e.innerHTML=IC(e.dataset.ic,+e.dataset.s||18,+e.dataset.sw||2.2)});document.querySelector('.brand .logo').innerHTML=LOGO(34);</script>
<script src="app.js"></script></body></html>
