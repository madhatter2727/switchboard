<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Space Shooter</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { border: 2px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="600" height="800"></canvas>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// --- Game state ---
let player, bullets, enemies, particles, score, gameOver, keys;
keys = {};
score = 0;
gameOver = false;

function reset() {
  player = { x: c.width / 2, y: c.height - 60, w: 40, h: 30, speed: 5, alive: true };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  gameOver = false;
}

// --- Input ---
document.addEventListener('keydown', e => { keys[e.code] = true; if(['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Spawn enemies ---
let spawnTimer = 0;
function update() {
  // Player movement
  if (player.alive) {
    if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > player.w / 2) player.x -= player.speed;
    if ((keys['ArrowRight'] || keys['KeyD']) && player.x < c.width - player.w / 2) player.x += player.speed;
  }

  // Shooting
  if (keys['Space'] && !shootCooldown) {
    shootCooldown = true;
    bullets.push({ x: player.x, y: player.y - player.h / 2, w: 4, h: 16 });
    setTimeout(() => { shootCooldown = false; }, 200);
  }

  // Spawn enemies
  spawnTimer++;
  if (spawnTimer > 45) {
    spawnTimer = 0;
    const x = Math.random() * (c.width - 60) + 30;
    enemies.push({ x, y: -20, w: 30, h: 30, speed: 1.5 + Math.random(), alive: true });
  }

  // Update bullets
  for (let b of bullets) {
    b.y -= 8;
  }
  bullets = bullets.filter(b => b.y > -20);

  // Update enemies & collision
  for (let e of enemies) {
    if (!e.alive) continue;
    e.y += e.speed;

    // Hit player?
    if (player.alive && rectOverlap(player, e)) {
      endGame();
      return;
    }

    // Reached bottom?
    if (e.y > c.height + 20) {
      e.alive = false;
      particles.push({ x: e.x, y: e.y, vx: 0, vy: 2, life: 30, color: '#ff4444' });
    }

    // Hit by bullet?
    for (let b of bullets) {
      if (!b.alive && !e.alive) continue;
      if (rectOverlap(b, e)) {
        b.alive = false;
        e.alive = false;
        score += 10;
        particles.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 4, vy: -2, life: 20, color: '#ffcc00' });
      }
    }
  }
  enemies = enemies.filter(e => e.alive);

  // Update particles
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

function rectOverlap(a, b) {
  return a.x - a.w / 2 < b.x + b.w / 2 && a.x + a.w / 2 > b.x - b.w / 2 &&
         a.y - a.h / 2 < b.y + b.h / 2 && a.y + a.h / 2 > b.y - b.h / 2;
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  player.alive = false;
  particles.push({ x: player.x, y: player.y, vx: 0, vy: 3, life: 40, color: '#ff0000' });
}

// --- Draw ---
function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, c.width, c.height);

  // Stars background
  ctx.fillStyle = '#222';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 73 + score * 0.1) % c.width;
    const sy = ((i * 59 + Date.now() / 20) % c.height);
    ctx.fillRect(sx, sy, 1, 1);
  }

  // Player ship (triangle)
  if (player.alive) {
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.h / 2);
    ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
    ctx.lineTo(player.x, player.y + player.h / 4);
    ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
    ctx.closePath();
    ctx.fill();

    // Engine glow
    ctx.fillStyle = '#ff8';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y + player.h / 4);
    ctx.lineTo(player.x - 5, player.y + player.h / 2 + Math.random() * 10);
    ctx.lineTo(player.x + 5, player.y + player.h / 2 + Math.random() * 10);
    ctx.closePath();
    ctx.fill();
  }

  // Bullets
  for (let b of bullets) {
    if (!b.alive) continue;
    ctx.fillStyle = '#ff0';
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }

  // Enemies (aliens – simple shapes)
  for (let e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.h / 2);
    ctx.lineTo(e.x + e.w / 2, e.y + e.h / 2);
    ctx.lineTo(e.x, e.y + e.h / 3);
    ctx.lineTo(e.x - e.w / 2, e.y + e.h / 2);
    ctx.closePath();
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x - 6, e.y - 4, 4, 4);
    ctx.fillRect(e.x + 2, e.y - 4, 4, 4);
  }

  // Particles
  for (let p of particles) {
    if (!p.life) continue;
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`Score: ${score}`, c.width / 2, 30);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(100, 280, 400, 240);
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', c.width / 2, 350);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText(`Final Score: ${score}`, c.width / 2, 390);
    ctx.fillText('Press SPACE to restart', c.width / 2, 430);
  }
}

// --- Loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
