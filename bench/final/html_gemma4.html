<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivational Quote Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        #quoteDisplay {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #4CAF50;
            border-radius: 8px;
            min-height: 100px;
            background-color: #e8f5e9;
            font-size: 1.3em;
            color: #2e7d32;
            font-style: italic;
            transition: all 0.3s ease;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.1s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Daily Motivation ✨</h1>
        
        <!-- Area where the quote will be displayed -->
        <div id="quoteDisplay">Click the button to get inspired!</div>

        <!-- The button that triggers the action -->
        <button onclick="generateQuote()">Get New Quote</button>
    </div>

    <script>
        // Array of motivational quotes
        const quotes = [
            "The only way to do great work is to love what you do. - Steve Jobs",
            "Believe you can and you're halfway there. - Theodore Roosevelt",
            "The future belongs to those who believe in the beauty of their dreams. - Eleanor Roosevelt",
            "Strive not to be a success, but rather to be of value. - Albert Einstein",
            "The best time to plant a tree was 20 years ago. The second best time is now. - Chinese Proverb",
            "Your time is limited, so don't waste it living someone else's life. - Steve Jobs",
            "The journey of a thousand miles begins with a single step. - Lao Tzu"
        ];

        function generateQuote() {
            // 1. Generate a random index
            const randomIndex = Math.floor(Math.random() * quotes.length);
            
            // 2. Select the quote
            const randomQuote = quotes[randomIndex];
            
            // 3. Update the HTML element with the new quote
            document.getElementById('quoteDisplay').textContent = randomQuote;
        }
    </script>

</body>
</html>
