<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivational Quote Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        #quote-display {
            font-size: 1.25rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-style: italic;
        }

        .author {
            font-size: 1rem;
            color: #777;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-weight: 600;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily Inspiration</h1>
        <div id="quote-display">Click the button below for a new quote!</div>
        <p class="author" id="author-display"></p>
        <button onclick="getRandomQuote()">Get a New Quote</button>
    </div>

    <script>
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
            { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
            { text: "Your limitation—it's only your imagination.", author: "Unknown" },
            { text: "Act as if what you do makes a difference. It does.", author: "William James" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
            { text: "It always seems impossible until it's done.", author: "Nelson Mandela" }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quote = quotes[randomIndex];
            
            document.getElementById('quote-display').textContent = quote.text;
            document.getElementById('author-display').textContent = `— ${quote.author}`;
            
            // Optional: Add a small animation effect
            const btn = document.querySelector('button');
            btn.style.opacity = '0.5';
            setTimeout(() => {
                btn.style.opacity = '1';
            }, 200);
        }
    </script>

</body>
</html>
