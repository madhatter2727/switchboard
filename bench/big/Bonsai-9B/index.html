<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Space Defender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="startScreen">
<h1>Space Defender</h1>
<p>Defend Earth from alien invaders!</p>
<button id="startBtn">Start Game</button>
<p>Controls: Arrow keys or WASD to move, Space to shoot, P to pause</p>
</div>
<div id="gameScreen" style="display:none;">
<canvas id="gameCanvas"></canvas>
<div id="uiOverlay">
<div id="livesDisplay">Lives: <span id="lives">10</span></div>
<div id="scoreDisplay">Score: <span id="score">0</span></div>
<div id="highScoreDisplay">High Score: <span id="highScore">0</span></div>
</div>
</div>
<div id="gameOverScreen" style="display:none;">
<h1>Game Over</h1>
<p>Final Score: <span id="finalScore">0</span></div>
<button id="restartBtn">Play Again</button>
</div>
</body>
</html>
